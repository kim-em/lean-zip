name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    # The shipped library + native test driver. Pure Lean: no system
    # libraries installed — this job doubles as the check that the library
    # really has no C dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build
        id: cache
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'Zip/**/*.lean', 'ZipTest/**/*.lean', 'ZipTest.lean', 'Zip.lean', 'c/**') }}
          restore-keys: lake-

      - name: Clean stale Lake cache on fallback restore
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Lake caches run_io results (like moreLinkArgs) deeply in .lake/.
          # When restored from a fallback key, lakefile.lean may have changed
          # but cached run_io results are stale. Nuclear clean is the only
          # reliable way to force re-evaluation.
          rm -rf .lake

      - name: Build
        run: lake -R build

      - name: Test
        run: lake -R test

  conformance:
    # Dev-only conformance/ sub-package: the native codec vs system zlib
    # (via lean-zlib), including RFC interop in both directions and a
    # fixed-seed fuzz pass. The only job that needs system zlib.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev pkg-config

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build
        id: cache
        uses: actions/cache@v4
        with:
          # The conformance package builds the parent Zip library into the
          # root .lake/, then its own targets into conformance/.lake/.
          path: |
            .lake
            conformance/.lake
          key: conformance-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'Zip/**/*.lean', 'c/**', 'conformance/**') }}
          restore-keys: conformance-

      - name: Clean stale Lake cache on fallback restore
        if: steps.cache.outputs.cache-hit != 'true'
        run: rm -rf .lake conformance/.lake

      # Build straight from the committed conformance/lake-manifest.json —
      # `lake build` materializes the pinned git dependencies itself, so this
      # also verifies the checked-in manifest is sufficient (no `lake update`
      # needed).
      - name: Build conformance package
        run: cd conformance && lake -R build

      - name: Test conformance package
        run: cd conformance && lake -R test
